services:
  liveness-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9001:9001"  # HTTP port
      - "9443:9443"  # HTTPS port
    volumes:
      - ./temp_uploads:/app/temp_uploads
      - ./resources:/app/resources
      - ./ssl:/app/ssl  # Mount SSL certificates directory
    environment:
      - PYTHONUNBUFFERED=1
      - FORCE_CPU=1
      - SSL_KEYFILE=/app/ssl/key.pem
      - SSL_CERTFILE=/app/ssl/cert.pem
      - HOST=0.0.0.0
      - HTTP_PORT=9001
      - HTTPS_PORT=9443
      - CONFIDENCE_THRESHOLD=0.65
      - SMOOTHING_WINDOW=5
      - MAX_FILE_SIZE=104857600
      - ALLOWED_ORIGINS=["*"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
